# GRETTA CI — the lighter gate (typecheck + unit/component tests).
#
# Intentionally not the full `pnpm check`: lint/format run fast locally and in
# pre-commit, and `build` is covered by the type check plus the tests here, so
# this stays quick on every push. To promote it to the full gate later, swap the
# two run steps for a single `pnpm check`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per branch/PR; newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >= 22.13 (its store uses the built-in
          # node:sqlite module, absent on Node 20). Node 20 is also being
          # deprecated on GitHub runners.
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Diagnostic: scripts/kb/store.sqlite.test.mts (the only file loading the
      # better-sqlite3 native addon) has twice crashed its Vitest worker here —
      # "Worker exited unexpectedly" under the forks pool, then an actual
      # SIGSEGV under threads. Both pools failing points away from Vitest and
      # toward better-sqlite3's bundled linux-x64 prebuild itself. This step
      # deletes that prebuild and forces a from-source rebuild via node-gyp, so
      # the test run below exercises a freshly compiled binary instead. Remove
      # this step (and the comment above `test` in vitest.config.ts) once we
      # know whether that was the actual cause.
      - name: Rebuild better-sqlite3 from source
        run: |
          pkg_dir=$(find node_modules/.pnpm -maxdepth 1 -iname "better-sqlite3@*" -print -quit)/node_modules/better-sqlite3
          rm -f "$pkg_dir/prebuilds/linux-x64.node"
          (cd "$pkg_dir" && npx node-gyp rebuild --release)
          test -f "$pkg_dir/build/Release/better_sqlite3.node"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
