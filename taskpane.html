<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRETTA</title>
    <!-- Office.js must load from the CDN, synchronously, before the app bundle.
         Outside an Office host (browser dev mode) it resolves with host: null,
         which services/office/host.ts maps to { available: false }. -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Static, pre-JS placeholder with a build stamp. Meaning at a glance:
           stays forever = HTML is fresh but the JS never ran; app replaces it
           = healthy; you never see it at all = Word served a STALE cached page
           (clear ~/Library/Containers/com.microsoft.Word/Data/Documents/wef). -->
      <div
        id="boot-placeholder"
        style="
          font:
            13px -apple-system,
            'Segoe UI',
            sans-serif;
          color: #666;
          padding: 16px;
        "
      >
        Loading GRETTA · build 2026-07-20a…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
